name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: |
          python3 -B -m py_compile \
            skills/update-orchestration-skills/scripts/benchmarks.py \
            skills/update-orchestration-skills/scripts/catalogs.py \
            skills/update-orchestration-skills/scripts/manager_lock.py \
            skills/update-orchestration-skills/scripts/read_quota.py \
            skills/update-orchestration-skills/scripts/refresh.py \
            skills/update-orchestration-skills/scripts/resolve_lanes.py \
            tests/test_manager_lock.py \
            tests/test_resolve_lanes.py \
            tests/test_resolve_lanes_benchmarks.py \
            tests/test_resolve_lanes_quota.py \
            tests/test_read_quota.py \
            tests/test_script_isolation.py \
            tests/test_skills.py \
            tests/test_updater.py

      - name: Validate bundled JSON files
        run: |
          python3 -B -c "
          import json, pathlib
          for p in [
              'skills/update-orchestration-skills/references/benchmark-suite.json',
              'skills/update-orchestration-skills/references/provider-catalogs.json',
              'examples/measurements.json',
              'examples/provider-state.json',
          ]:
              json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              print('Valid JSON:', p)
          "

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Smoke test offline measurement preview
        run: |
          python3 -B skills/update-orchestration-skills/scripts/refresh.py \
            --workspace . --input examples/measurements.json --preview > /dev/null

      - name: Smoke test deterministic lane resolver
        run: |
          python3 -B skills/update-orchestration-skills/scripts/resolve_lanes.py \
            --workspace . --profile skills/astra-orchestration/project-profile.example.md \
            --role coding --state examples/provider-state.json --now 2026-11-21T16:00:00Z > /dev/null
          python3 -B skills/update-orchestration-skills/scripts/resolve_lanes.py \
            --workspace . --profile skills/astra-orchestration/project-profile.example.md \
            --role review --author-family openai --state examples/provider-state.json --now 2026-11-21T16:00:00Z > /dev/null
